name: Native Windows UIA checks
on:
  workflow_run:
    workflows: ['Windows validation and package']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-uia:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BENDER_WINDOWS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,voice]"
      - name: Native form learning, replay and Windows permission boundary
        run: python -m pytest -m windows -v --junitxml=native-results.xml
      - name: Publish native diagnostics
        if: always()
        run: python scripts/ci_summary.py native-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-uia-test-results
          path: native-results.xml
