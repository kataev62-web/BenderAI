name: Windows validation and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev,voice]"
      - name: Compile and validate dependencies
        run: |
          python -m compileall -q src tests
          python -m pip check
      - name: Unit and portable integration tests
        run: python -m pytest -m "not windows" -q --junitxml=test-results.xml
      - name: Publish test diagnostics
        if: always()
        run: python scripts/ci_summary.py test-results.xml
      - name: Report native process protection context
        run: |
          @'
          import os
          from bender_ai.windows import check_process_access
          from bender_ai.security import Denied
          try:
              check_process_access(os.getpid())
              print('::notice title=Native integrity::Runner process is a permitted non-elevated target')
          except Denied as exc:
              print('::notice title=Native integrity::' + str(exc))
          '@ | python
      - name: Native source UIA preflight with non-elevated fixtures
        env:
          BENDER_WINDOWS_INTEGRATION: '1'
          BENDER_LAUNCH_REPORT: build/launch-preflight.json
        run: python -m pytest -m windows -v --junitxml=build/native-preflight.xml
      - name: Publish source UIA preflight diagnostics
        if: always()
        run: |
          python scripts/ci_summary.py build/native-preflight.xml
          python -c "import json,pathlib; p=pathlib.Path('build/launch-preflight.json'); rows=json.loads(p.read_text(encoding='utf-8'))['apps'] if p.exists() else []; [print('::notice title=App launch preflight::'+r['app']+': '+r['status']) for r in rows]"
      - name: Package and smoke test frozen executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Native UIA across distinct packaged fixture applications
        env:
          BENDER_WINDOWS_INTEGRATION: '1'
          BENDER_TRAINING_EXE: ${{ github.workspace }}\dist\BenderAI\BenderTraining.exe
          BENDER_TRAINING_PEER_EXE: ${{ github.workspace }}\dist\BenderAI\BenderTrainingPeer.exe
        run: python -m pytest -m windows -v --junitxml=build/native-results.xml
      - name: Publish native UIA diagnostics
        if: always()
        run: |
          python scripts/ci_summary.py build/native-results.xml
          python -c "import json,pathlib; p=pathlib.Path('build/launch-report.json'); rows=json.loads(p.read_text(encoding='utf-8'))['apps'] if p.exists() else []; [print('::notice title=App launch outcome::'+r['app']+': '+r['status']) for r in rows]"
      - name: Require native tests and attach evidence to package
        shell: pwsh
        run: |
          [xml]$native = Get-Content build/native-results.xml -Raw -Encoding UTF8
          $suite = $native.testsuites.testsuite
          if ([int]$suite.tests -lt 4 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
            throw 'Native tests must execute with zero skips, failures and errors'
          }
          Copy-Item build/native-results.xml dist/BenderAI/native-results.xml
          Copy-Item build/launch-report.json dist/BenderAI/launch-report.json
          Copy-Item build/launch-preflight.json dist/BenderAI/launch-preflight.json
          $info = Get-Content dist/BenderAI/BUILD-INFO.json -Raw | ConvertFrom-Json
          $info | Add-Member -NotePropertyName native_uia_tests -NotePropertyValue ([int]$suite.tests) -Force
          $info | Add-Member -NotePropertyName native_uia_skipped -NotePropertyValue 0 -Force
          $info | Add-Member -NotePropertyName native_fixture_mode -NotePropertyValue 'two-distinct-packaged-executables' -Force
          $info | ConvertTo-Json | Set-Content dist/BenderAI/BUILD-INFO.json -Encoding UTF8
          Compress-Archive -Path dist/BenderAI/* -DestinationPath dist/BenderAI-windows-x64.zip -Force
      - uses: actions/upload-artifact@v6
        with:
          name: BenderAI-windows-x64
          path: dist/BenderAI-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            build/native-results.xml
            build/native-preflight.xml
            build/packaged-smoke.json
            build/packaged-features.json
            build/launch-report.json
            build/launch-preflight.json
